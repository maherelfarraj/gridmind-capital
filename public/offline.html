<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · GridMind Capital</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
        --navy: #0a192f;
        --teal: #64ffda;
        --slate: #94a3b8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background: var(--navy);
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        min-height: 100dvh;
      }
      .card {
        max-width: 380px;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      .badge {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: rgba(100, 255, 218, 0.1);
        border: 1px solid rgba(100, 255, 218, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge svg { width: 36px; height: 36px; stroke: var(--teal); }
      h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
      p { font-size: 14px; line-height: 1.6; color: var(--slate); }
      button {
        margin-top: 4px;
        appearance: none;
        border: none;
        border-radius: 10px;
        background: var(--teal);
        color: var(--navy);
        font-size: 15px;
        font-weight: 600;
        padding: 12px 24px;
        min-height: 48px;
        cursor: pointer;
        width: 100%;
        max-width: 240px;
      }
      button:active { opacity: 0.85; }
      .hint { font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 1l22 22" />
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" />
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <line x1="12" y1="20" x2="12.01" y2="20" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>
        This page hasn&rsquo;t been saved for offline use yet. Pages you&rsquo;ve already
        visited are still available read-only. Any approvals you submit while offline
        are queued and will sync automatically when you reconnect.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
      <p class="hint">GridMind Capital</p>
    </div>
    <script>
      // Auto-reload the moment connectivity returns.
      window.addEventListener('online', () => location.reload())
    </script>
  </body>
</html>
